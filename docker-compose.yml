services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: laravel_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./src:/var/www
      - vendor_data:/var/www/vendor
      - storage_data:/var/www/storage
    networks:
      - laravel

  nginx:
    image: nginx:latest
    container_name: laravel_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./src:/var/www
      - vendor_data:/var/www/vendor
      - storage_data:/var/www/storage
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - /etc/letsencrypt:/etc/letsencrypt
    depends_on:
      - app
    networks:
      - laravel

  mysql:
    image: mysql:8.0
    container_name: laravel_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: lingoaz
      MYSQL_ROOT_PASSWORD: secret123
      MYSQL_PASSWORD: secret
      MYSQL_USER: lingoaz_user
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - laravel

  redis:
    image: redis:latest
    container_name: laravel_redis
    restart: unless-stopped
    command: redis-server --requirepass £_9V?i5N0FeC
    networks:
      - laravel

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: laravel_phpmyadmin
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      PMA_HOST: laravel_mysql
      PMA_ABSOLUTE_URI: http://lingoaz.online:8080/
      HIDE_PHP_VERSION: "true"
    networks:
      - laravel

networks:
  laravel:

volumes:
  mysql_data:
  vendor_data:
  storage_data: