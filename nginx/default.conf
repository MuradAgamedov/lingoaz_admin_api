server {
    listen 80;
    server_name lingoaz.online www.lingoaz.online;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name lingoaz.online www.lingoaz.online;

    ssl_certificate /etc/letsencrypt/live/lingoaz.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lingoaz.online/privkey.pem;

    root /var/www/public;
    index index.php index.html;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    location ~ /\.ht {
        deny all;
    }
}

server {
    listen 80;
    server_name imtahanver.online www.imtahanver.online;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name imtahanver.online www.imtahanver.online;

    ssl_certificate /etc/letsencrypt/live/imtahanver.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/imtahanver.online/privkey.pem;

    location / {
        proxy_pass http://172.17.0.1:8085;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}