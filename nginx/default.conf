# ==========================================
# 6. KODBAZA.ONLINE (KODAZ - Port 8002)
# ==========================================
server {
    listen 80;
    server_name kodbaza.online www.kodbaza.online;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name kodbaza.online www.kodbaza.online;

    ssl_certificate /etc/letsencrypt/live/kodbaza.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kodbaza.online/privkey.pem;

    client_max_body_size 0;

    location /app {
        proxy_pass http://172.17.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location / {
        proxy_pass http://172.17.0.1:8002;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}

