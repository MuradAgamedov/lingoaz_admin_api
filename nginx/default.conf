# ==========================================
# 7. SUATASADOV.COM (Laravel portfolio - Port 8095)
# ==========================================
server {
    listen 80;
    server_name suatasadov.com www.suatasadov.com;

    location /.well-known/acme-challenge/ {
        proxy_pass http://172.17.0.1:8095;
        proxy_set_header Host $host;
    }

    location / {
        return 301 https://suatasadov.com$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name www.suatasadov.com;

    ssl_certificate /etc/letsencrypt/live/suatasadov.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/suatasadov.com/privkey.pem;

    return 301 https://suatasadov.com$request_uri;
}

server {
    listen 443 ssl;
    server_name suatasadov.com;

    ssl_certificate /etc/letsencrypt/live/suatasadov.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/suatasadov.com/privkey.pem;

    client_max_body_size 64m;

    location / {
        proxy_pass http://172.17.0.1:8095;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
